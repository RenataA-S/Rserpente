<!DOCTYPE html>
<!-- Define o tipo de documento como HTML5 -->
<html lang="pt-BR">
<!-- Define que o idioma principal da página é o português do Brasil -->
<head>
<!-- Início do cabeçalho da página (onde ficam as configurações e conexões de arquivos) -->
  <meta charset="UTF-8">
  <!-- Define a codificação de caracteres para UTF-8, permitindo acentos e símbolos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Ajusta o tamanho da tela para funcionar perfeitamente em celulares e computadores -->
  <title>Rserpente Neon High-Focus</title>
  <!-- Define o título que aparece na aba do navegador -->
  
  <link rel="stylesheet" href="style.css">
  <!-- Conecta o arquivo CSS externo que contém todas as regras visuais e cores -->
</head>
<body>
<!-- Início da Estrutura Visual HTML -->

  <h1>Rserpente</h1>
  <!-- Título principal visível na parte superior do jogo -->

  <div class="controls-panel">
  <!-- Painel de Controles e Dificuldades -->
    <div class="score-board">Pontos: <span id="score">0</span></div>
    <!-- Exibe a pontuação dinamicamente dentro do span id="score" -->
    
    <button class="btn active" id="btn-easy" onclick="setDifficulty('easy')">Fácil</button>
    <!-- Botão do modo Fácil. Inicia marcado como ativo -->
    
    <button class="btn" id="btn-medium" onclick="setDifficulty('medium')">Intermediário</button>
    <!-- Botão do modo Intermediário -->
    
    <button class="btn" id="btn-hard" onclick="setDifficulty('hard')">Difícil</button>
    <!-- Botão do modo Difícil -->
  </div>

  <div id="game-container">
  <!-- Container principal do jogo -->
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <!-- Quadro 400x400 pixels onde o JavaScript vai desenhar a serpente e as frutas -->

    <div id="game-over-screen">
    <!-- Overlay com a mensagem de fim de jogo -->
      <h2>GAME OVER</h2>
      <!-- Título de aviso de derrota -->
      <p>Sua pontuação: <span id="final-score">0</span></p>
      <!-- Exibe os pontos finais conquistados -->
      <button class="btn" onclick="resetGame()">Jogar Novamente</button>
      <!-- Botão que chama a função do JS para reiniciar a partida -->
    </div>
  </div>

  <script src="script.js"></script>
  <!-- Conecta o arquivo JavaScript externo que contém toda a lógica de funcionamento -->
</body>
</html>
