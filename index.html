<!DOCTYPE html>
<!-- Define que o arquivo segue o padrão moderno do HTML5 -->
<html lang="pt-BR">
<!-- Define o idioma da página como Português do Brasil -->
<head>
<!-- Início do cabeçalho de configurações da página -->
  <meta charset="UTF-8">
  <!-- Permite a exibição correta de acentos e caracteres especiais -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Ajusta o layout para se adaptar a diferentes tamanhos de tela -->
  <title>Rserpente Neon High-Focus</title>
  <!-- Título do jogo que é exibido na aba do navegador -->
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <!-- Favicon com logo de serpente embutido diretamente no HTML -->

  <link rel="stylesheet" href="style.css">
  <!-- Importa o arquivo de estilos visuais em CSS -->
</head>
<!-- Fim do cabeçalho de configurações -->
<body>
<!-- Início do corpo visível da aplicação -->

  <h1>Rserpente</h1>
  <!-- Título principal em destaque na parte superior da tela -->

  <div class="controls-panel">
  <!-- Bloco container que agrupa o placar de pontos e os botões de opção -->
    <div class="score-board">Pontos: <span id="score">0</span></div>
    <!-- Exibe o texto de pontos e o número atualizado via JavaScript -->
    
    <button class="btn active" id="btn-easy" onclick="setDifficulty('easy')">Fácil</button>
    <!-- Botão para selecionar a dificuldade Fácil -->
    
    <button class="btn" id="btn-medium" onclick="setDifficulty('medium')">Intermediário</button>
    <!-- Botão para selecionar a dificuldade Intermediária -->
    
    <button class="btn" id="btn-hard" onclick="setDifficulty('hard')">Difícil</button>
    <!-- Botão para selecionar a dificuldade Difícil -->
  </div>
  <!-- Fim do painel de controles e opções -->

  <div id="game-container">
  <!-- Container principal que envolve a área de jogo e as telas de aviso -->
    <canvas id="snakeCanvas" width="900" height="900"></canvas>
    <!-- Tela do jogo aumentada para 700x700 pixels para melhor visualização -->

    <div id="game-over-screen">
    <!-- Camada de aviso que aparece sobre o jogo ao perder a partida -->
      <h2>GAME OVER</h2>
      <!-- Título de alerta de fim de jogo em cor chamativa -->
      <p>Sua pontuação: <span id="final-score">0</span></p>
      <!-- Mostra a quantidade de pontos finais alcançados -->
      <button class="btn" onclick="resetGame()">Jogar Novamente</button>
      <!-- Botão que aciona a função para reiniciar a partida -->
    </div>
    <!-- Fim da tela de Game Over -->
  </div>
  <!-- Fim do container do jogo -->

  <footer class="footer">
  <!-- Seção de rodapé da página -->
    <p>By Renata A.S</p>
    <!-- Créditos de autoria do projeto com destaque visual -->
  </footer>
  <!-- Fim do rodapé -->

  <script src="script.js"></script>
  <!-- Importa o arquivo com a lógica do jogo em JavaScript -->
</body>
<!-- Fim do corpo visível da aplicação -->
</html>
<!-- Fim do documento HTML -->
